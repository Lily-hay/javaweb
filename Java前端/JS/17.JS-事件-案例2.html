<!DOCTYPE html>
<html>

<head>
    <title>表单</title>
    <style>
        label {
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-right: 10px;
        }

        input {
            width: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .btn {
            width: 150px;
        }

        .tip {
            color: #ff0000;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div>
        <h1>用户注册</h1>
        <form>
            用户名：
            <input type="text" id="username" name="username" placeholder="用户名不能为空且长度在4-16个字符">
            <span class="tip" id="name_msg"></span> <br>

            手机号：
            <input type="text" id="phone" name="phone" placeholder="手机号不能为空且长度为11位">
            <span class="tip" id="phone_msg"></span>
            <br>

            <input type="submit" value="提交" class="btn">
            <input type="reset" value="重置" class="btn">
        </form>
    </div>


    <script>
       //DOM元素，离焦事件，校验
       let input1=document.querySelector("#username");
       let checkName=()=>
    {
        flag=1;
        let usernameValue=input1.value;
        if(usernameValue.length<4 || usernameValue.length>16)
        {
            document.querySelector("#name_msg").innerHTML='用户名不合法';
            flag=0;
        }
        else{
            document.querySelector("#name_msg").innerHTML='';
        }
        return flag;

    }
       input1.addEventListener('blur',checkName);

      let input2=document.querySelector("#phone");
      let checkPhone=()=>
    {
        flag=1;
        let phoneValue=input2.value;
        if(phoneValue.length!=11)
        {
            document.querySelector("#phone_msg").innerHTML='用户名不合法';
            flag=0;
        }
        else{
            document.querySelector("#phone_msg").innerHTML='';
        }
        return flag;

    }
       input2.addEventListener('blur',checkPhone)
       
       //校验表单提交是否合法
       document.querySelector("form").addEventListener('submit',(event)=>
    {
        if(!checkName() || !checkPhone())
    {
        event.preventDefault();//阻止表单提交
    }
    })


    </script>
</body>

</html>
