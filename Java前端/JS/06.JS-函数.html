<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-函数</title>
</head>

<body>
    <script>
        //1、定义函数 特点1：参数可以任意个，但按规范写；特点2：形参与返回值不需要类型
        function add(a,b)
        {
            return a+b;
        }

        //1-2.匿名函数 --表达式
        let add1=function(a,b)
        {
            return a+b;
        }
        //1-3.匿名函数 --箭头函数
        let add2= (a,b) =>{
            return a+b;
        }
        
        alert(add2(20,30));
        let result=add(10,20);
        alert(result)

    </script>
</body>
</html>
