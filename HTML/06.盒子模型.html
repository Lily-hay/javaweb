<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型</title>
</head>
<style>
    div{
        width:200px;
        height:200px;
        background-color: antiquewhite;
        padding: 10px 5px 15px 20px; /* 内边距 上右下左 */
        border:10px solid red;/* 设置边框 */
        margin: 20px 40%;/* 设置外边距 */
        box-sizing: border-box;/* 固定盒子大小 */


    }
</style>
<body>
    <!-- div 一个div就是一行 -->
    <div>哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈</div>
    

    <!-- span 行内修饰 -->
    <span>我是span </span>
    <span>我是span </span>
    <span>我是span </span>
</body>
</html>
